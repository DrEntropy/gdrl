[project]
name = "gdrl"
version = "0.1.0"
description = "Local environment for the Grokking Deep Reinforcement Learning notebooks"
requires-python = ">=3.13"
dependencies = [
    "gymnasium",
    "numpy",
    "matplotlib",
    "tabulate",
    "tqdm",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdrl_envs"]
